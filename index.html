<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <header>
      <div class="avatar">AI</div>
      <div><h1>Help Desk Chatbot</h1><p>Ask a question and I’ll do my best to help.</p></div>
    </header>
    <section id="messages" class="messages" aria-live="polite">
      <div class="bubble bot">Hi! Ask me about passwords, support hours, refunds, or creating an account.</div>
    </section>
    <form id="chat-form">
      <input id="message-input" autocomplete="off" maxlength="1000" placeholder="Type your question..." required>
      <button type="submit">Send</button>
    </form>
    <p class="hint">Starter FAQ bot · Your chat messages are stored locally in chatbot.db</p>
  </main>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
